<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Voice Assistant - Note Taker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .instructions { background: #f0f0f0; padding: 1em; border-radius: 8px; margin-bottom: 1em; }
        .note-box { margin-top: 2em; }
        button { padding: 0.5em 1em; font-size: 1em; }
    </style>
</head>
<body>
    <h1>Live AI Voice Assistant - Note Taker</h1>
    <div class="instructions">
        <p>Click <b>Start Live Note</b> and speak. Your note will appear in real time below.<br>
        When you're done, click <b>Stop</b> and save your note locally.</p>
    </div>
    <button onclick="startLiveNote()">Start Live Note</button>
    <button onclick="stopLiveNote()">Stop</button>
    <div class="note-box">
        <h2>Your Note:</h2>
        <textarea id="note" rows="5" cols="60"></textarea>
        <br>
        <button onclick="saveNote()">Save Note Locally</button>
        <span id="status"></span>
    </div>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = io();
        let mediaRecorder;
        let isRecording = false;
        function startLiveNote() {
            if (!navigator.mediaDevices) {
                alert('MediaDevices not supported.');
                return;
            }
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    let options = { mimeType: 'audio/ogg; codecs=opus' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'audio/webm' };
                    }
                    mediaRecorder = new MediaRecorder(stream, options);
                    mediaRecorder.start(1000); // 1 second chunks
                    isRecording = true;
                    document.getElementById('status').textContent = 'Recording...';
                    mediaRecorder.ondataavailable = function(e) {
                        if (e.data.size > 0 && isRecording) {
                            let reader = new FileReader();
                            reader.onloadend = function() {
                                socket.emit('audio_chunk', { chunk: reader.result, format: options.mimeType.includes('ogg') ? 'ogg' : 'webm' });
                            };
                            reader.readAsDataURL(e.data);
                        }
                    };
                });
        }
        function stopLiveNote() {
            if (mediaRecorder && isRecording) {
                isRecording = false;
                mediaRecorder.stop();
                document.getElementById('status').textContent = 'Stopped.';
            }
        }
        socket.on('transcription', function(data) {
            if (data.text) {
                document.getElementById('note').value += data.text + ' ';
                document.getElementById('status').textContent = 'Transcribed.';
            } else if (data.error) {
                document.getElementById('status').textContent = 'Error: ' + data.error;
            }
        });
        function saveNote() {
            var note = document.getElementById('note').value;
            if (!note) {
                document.getElementById('status').textContent = 'No note to save.';
                return;
            }
            fetch('/save_note', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note: note })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('status').textContent = 'Note saved!';
                } else {
                    document.getElementById('status').textContent = 'Error saving note.';
                }
            });
        }
    </script>
</body>
</html>
